name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - name: Verify the pinned checker and embedded TypeScript
        run: |
          test "$(bun --version)" = "$(cat .bun-version)"
          test "$(bun -p process.versions.typescript)" = "$(node -p 'require("./package.json").devDependencies.typescript')"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documents and local links
        run: python3 scripts/check-docs.py
      - name: Check whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
